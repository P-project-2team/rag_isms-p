# 도메인 설정 (설계서 v2 §7.1.2). 값 채우기는 이서준.
domain: insurance
dataset_path: datasets/insurance
company_name: 세이프라이프손해보험
bot_name: 세이프봇

llm:
  provider: mock          # mock | openai (LLM_PROVIDER 환경변수가 있으면 그쪽이 우선)
  model: gpt-4o-mini
  max_tokens: 512

retrieval:
  top_k: 4
  collection: insurance_kb
  poisoned_collection: insurance_kb_poisoned   # TODO(D-01): 오염 경로 결정 후

# 방어 모드 접근 정책 (설계서 v2 §7.3.3)
roles:
  guest:    {access_levels: [public]}
  customer: {access_levels: [public, customer_self], owner_scope: self}
  agent:    {access_levels: [public, agent], use_masked_records: true}
  admin:    {access_levels: [public, customer_self, agent, admin]}

# 방어 모드 보안 통제 플래그 (11/6 결정: 가드레일은 설정 플래그 on/off)
defended_controls:
  input_guard: true
  permission_filter: true
  context_isolation: true
  output_filter: true
  # TODO(D-03, D-09): 빈도 제한 임계값은 X-07 점검 대상이라 τ로 바꿔가며 측정
  rate_limit_per_minute: 10

log:
  retention_days: 180
