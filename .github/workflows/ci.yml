name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock   # CI는 실제 LLM API를 부르지 않는다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest
      - name: 데이터셋 계약 검증 (픽스처)
        run: python scripts/validate_dataset.py tests/fixtures/insurance_mini
      - name: 데이터셋 계약 검증 (보험 데이터셋, 있을 때만)
        run: |
          if [ -f datasets/insurance/manifest.json ]; then
            python scripts/validate_dataset.py datasets/insurance
          else
            echo "datasets/insurance/manifest.json 아직 없음 — 건너뜀"
          fi
